name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "conet_backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, temp/vishwacup]
    paths:
      - "conet_backend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: conet_backend

jobs:
  # ─── Lint + Type Safety ─────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Add ESLint to the project for meaningful lint checks.
      # Right now this step is a placeholder.
      - name: Lint (placeholder – add ESLint)
        run: echo "No linter configured yet. Add eslint to devDependencies."

  # ─── Unit + Integration Tests ───────────────────────────────────────────────
  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      SUPABASE_JWT_SECRET: test-secret-do-not-use-in-production
      # These point at the postgres service defined below
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conet_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/conet_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conet_test
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run Prisma migrations against test DB
        run: bunx prisma migrate deploy

      # Run unit tests first – they are fast, DB-independent,
      # and should fail loudly before touching real data.
      - name: Run unit tests
        run: bun test ./test/unit --timeout 10000

      # Integration tests exercise the HTTP layer with mocked Prisma.
      - name: Run integration tests
        run: bun test ./test/integration --timeout 15000 --max-concurrency 1

      # Coverage run across all tests
      - name: Run all tests with coverage
        run: bun test --coverage --max-concurrency 1 2>&1 | tee coverage-output.txt

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: conet_backend/coverage/
          if-no-files-found: warn

      # Fail the build if coverage drops below thresholds.
      # Thresholds are enforced in bunfig.toml.
      - name: Assert coverage thresholds
        run: |
          if grep -q "Coverage below threshold" coverage-output.txt; then
            echo "Coverage fell below configured thresholds."
            exit 1
          fi

  # ─── Security Audit ─────────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun audit is not yet released; fall back to npm audit with lock file.
      - name: Run npm audit (high severity)
        run: npx --yes audit-ci --high --package-manager npm
        continue-on-error: true # Remove once baseline is clean

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./conet_backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/conet_backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/conet_backend:${{ github.sha }}
