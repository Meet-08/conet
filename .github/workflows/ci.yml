name: ci

on:
  push:
    branches: ["main"]
    paths:
      - "conet_app/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conet_app

    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.41.6
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('conet_app/pubspec.lock') }}
          restore-keys: pub-

      - name: Create .env file
        run: echo "API_URL=http://10.0.2.2:3000" > .env

      - name: Install dependencies
        run: flutter pub get --no-example

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: Build & Distribute
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conet_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.41.6
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('conet_app/pubspec.lock') }}
          restore-keys: pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('conet_app/android/**/*.gradle*', 'conet_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install dependencies
        run: flutter pub get --no-example

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ vars.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Create .env
        run: |
          cat <<EOF > .env
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          IOS_CLIENT_ID=${{ secrets.IOS_CLIENT_ID }}
          WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}
          DEEP_LINK_HOST=${{ vars.DEEP_LINK_HOST }}
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Decode Firebase service account
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 --decode > $RUNNER_TEMP/firebase-service-account.json

      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ runner.temp }}/firebase-service-account.json
          groups: ${{ vars.TESTER_GROUP }}
          releaseNotes: |
            Build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
          file: conet_app/build/app/outputs/flutter-apk/app-release.apk
