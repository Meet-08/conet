name: ci

on:
  push:
    branches: ["main"]
    paths:
      - "conet_app/**"

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: conet_app

    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.38.3
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            conet_app/.dart_tool
          key: pub-${{ hashFiles('conet_app/pubspec.lock') }}
          restore-keys: pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: Build & Distribute
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: conet_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.38.3
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            conet_app/.dart_tool
          key: pub-${{ hashFiles('conet_app/pubspec.lock') }}
          restore-keys: pub-

      - name: Install dependencies
        run: flutter pub get

      # 🔐 Decode Release Keystore
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 🔐 Create key.properties
      - name: Create key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ vars.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # 🌍 Create .env
      - name: Create .env
        run: |
          cat <<EOF > .env
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          IOS_CLIENT_ID=${{ secrets.IOS_CLIENT_ID }}
          WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}
          EOF

      # 🏗 Build Release APK
      - name: Build APK
        run: flutter build apk --release

      # 🔎 Optional: Print SHA to verify signing
      - name: Print signing report
        run: cd android && ./gradlew signingReport

      # 🔥 Decode Firebase credentials
      - name: Decode Firebase service account
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 --decode > $RUNNER_TEMP/firebase-service-account.json

      # 🚀 Upload to Firebase App Distribution
      - name: Upload to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ runner.temp }}/firebase-service-account.json
          groups: ${{ vars.TESTER_GROUP }}
          releaseNotes: |
            Build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
          file: conet_app/build/app/outputs/flutter-apk/app-release.apk
