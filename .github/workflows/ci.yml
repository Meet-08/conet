name: ci

on:
  push:
    branches: ["main"]
    paths:
      - "conet_app/**"

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: conet_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.38.3

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            conet_app/.dart_tool
          key: pub-${{ hashFiles('conet_app/pubspec.lock') }}
          restore-keys: pub-

      - name: Create .env file
        run: echo "API_URL=http://10.0.2.2:3000" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build:
    name: Build & Distribute
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: conet_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.38.3

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            conet_app/.dart_tool
          key: pub-${{ hashFiles('conet_app/pubspec.lock') }}
          restore-keys: pub-

      - name: Create .env file
        run: |
          cat <<EOF > .env
          BACKEND_URL=${{ secrets.BACKEND_URL }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          IOS_CLIENT_ID=${{ secrets.IOS_CLIENT_ID }}
          WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Decode Firebase service account key
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" | base64 --decode > $RUNNER_TEMP/firebase-service-account.json

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ runner.temp }}/firebase-service-account.json
          groups: ${{ vars.TESTER_GROUP }}
          releaseNotes: |
            Build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
          file: conet_app/build/app/outputs/flutter-apk/app-release.apk
