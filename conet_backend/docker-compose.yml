services:
  nginx:
    image: nginx:latest
    container_name: nginx_cont
    ports:
      - "80:80"
      - "443:443"
    networks:
      - conet_network
    depends_on:
      - conet_backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  conet_backend:
    image: meetjbhuva/conet_backend:latest
    pull_policy: always
    ports:
      - "5000"
    env_file:
      - .env
    networks:
      - conet_network
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - 6379
    networks:
      - conet_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  conet_network:
