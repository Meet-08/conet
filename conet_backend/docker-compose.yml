services:
  conet_backend:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - conet_network
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - 6379
    networks:
      - conet_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  conet_network:
